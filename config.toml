# Edit device names here; find endpoint names in Windows Sound settings.
# Apps should record from Voicemeeter Out B1 (VB-Audio Voicemeeter VAIO).
# Re-run `uv run fmike install` after moving this repository. Bootstrap: powershell -ExecutionPolicy Bypass -File install.ps1
poll_seconds = 1.5
banana_exe = 'C:\Program Files (x86)\VB\Voicemeeter\voicemeeterpro_x64.exe'

[devices]
mic = "Microphone (Razer USB Sound Card)"
clock = "Speakers (Razer USB Sound Card)"
solo = "VG245 ("
party = "Speakers (Razer USB Sound Card)"
b1 = "Voicemeeter Out B1 ("
input = "Voicemeeter Input ("

# color = [x, y] for the strip's Intellipan color panel (x -0.5..0.5, y 0..1).
# eq = [[freq Hz, gain dB, Q], ...] on the B1 bus, up to 6 bands (gain -36..18); [] turns the EQ off.
[presets.clean]
gain = 0.0
limit = 12
compression = 0.0
color = [0.0, 0.0]
eq = []
label = "mic"

# Maximum annoyance: no bass, nasal honk, +18 dB where hearing is most sensitive (2-5 kHz), harsh sibilance,
# driven into clipping by full gain and compression.
[presets.funny]
gain = 12.0
limit = 12
compression = 10.0
color = [0.5, 1.0]
eq = [
    [80, -36, 0.7],
    [250, -24, 1.0],
    [1000, 12, 4.0],
    [3150, 18, 2.0],
    [4500, 18, 3.0],
    [8000, 12, 3.0],
]
label = "mic FUNNY"
